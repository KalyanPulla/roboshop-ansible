- name: Load App Pre-requistes
  ansible.builtin.include_tasks: pre-reqs.yml

- name: Install GoLang & Git
  ansible.builtin.dnf:
    name:
      - golang
      - git
    state: present

- name: Install Mysql and load Schema
  ansible.builtin.include_tasks: mysql-schema.yml

- name: Compile Application Code
  ansible.builtin.shell: go mod tidy && CGO_ENABLED=0 go build -o /app/catalogue .
  args:
    chdir: /app

- name: Load SystemD
  ansible.builtin.include_tasks: systemd.yaml
